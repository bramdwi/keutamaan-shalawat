<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Islamic Geometric Border Motif -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10, 6" opacity="0.6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Center Symbol: Book & Crescent / Lantern Motif -->
  <g transform="translate(0, -10)">
    <!-- Crescent Moon -->
    <path d="M 256 120 A 100 100 0 1 0 356 220 A 80 80 0 1 1 256 120 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Eight-pointed Star (Rub el Hizb) in Moon -->
    <g transform="translate(305, 175) scale(0.7)">
      <polygon points="20,0 26,14 40,20 26,26 20,40 14,26 0,20 14,14" fill="#ffffff" />
    </g>

    <!-- Open Quran / Holy Book Base -->
    <path d="M 160 300 C 210 280 250 295 256 315 C 262 295 302 280 352 300 C 352 350 302 335 256 355 C 210 335 160 350 160 300 Z" fill="url(#goldGrad)" />
    <path d="M 165 305 C 210 288 248 300 256 318 C 264 300 302 288 347 305 L 347 342 C 302 328 264 338 256 350 C 248 338 210 328 165 342 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Spine Line -->
    <line x1="256" y1="318" x2="256" y2="350" stroke="#064e3b" stroke-width="2.5" />
  </g>

  <!-- Title Ribbon Text -->
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#fef08a" letter-spacing="3">KEUTAMAAN SHALAWAT</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Amiri', serif" font-weight="600" font-size="24" fill="#ffffff" opacity="0.9">ﷺ</text>
</svg>